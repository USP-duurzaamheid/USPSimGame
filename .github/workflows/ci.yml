name: CI

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore USPSimGame.sln
      - run: dotnet build USPSimGame.sln --no-restore --configuration Release --nologo
      - run: dotnet test USPSimGame.sln --no-build --configuration Release --nologo

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
